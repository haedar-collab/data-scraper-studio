name: Scheduled scraping

on:
  schedule:
    # Tiap 15 menit (UTC). GitHub bisa terlambat beberapa menit saat sibuk.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      run_all:
        description: "Jalankan SEMUA sumber aktif sekarang"
        type: boolean
        default: false

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run due schedules
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPER_TZ: Asia/Jakarta
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Secret DATABASE_URL belum diisi"; exit 1; fi
          if [ "${{ inputs.run_all }}" = "true" ]; then python cron_runner.py --all; else python cron_runner.py; fi
